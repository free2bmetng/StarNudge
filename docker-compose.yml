# Optional local Postgres for people without a local server. Requires Docker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starnudge
    ports:
      - "5432:5432"
    volumes:
      - starnudge-pg:/var/lib/postgresql/data

volumes:
  starnudge-pg:
